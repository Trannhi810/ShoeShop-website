<header class="site-header">
  <div class="header-inner">

    <!-- LOGO -->
    <div class="logo">
      <a href="/index.html">ShoeShop</a>
    </div>

    <!-- MENU -->
    <nav class="main-nav">
      <a href="/index.html">Trang chủ</a>
      <a href="/pages/products.html">Sản phẩm</a>
      <a href="/pages/cart.html">Giỏ hàng</a>
    </nav>

    <!-- RIGHT -->
    <div class="header-right" id="headerRight"></div>

  </div>
</header>

<script>
  function performSearch() {
    const searchInput = document.getElementById('searchInput');
    const searchTerm = searchInput.value.trim();
    if (searchTerm) {
      window.location.href = `/pages/products.html?search=${encodeURIComponent(searchTerm)}`;
    }
  }

  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('shoeshop_cart_v1') || '[]');
    const cartCount = document.getElementById('cartCount');
    if (cartCount) {
      const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      cartCount.textContent = totalItems;
      cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
    }
  }

  function renderHeaderAuth() {
    const headerRight = document.getElementById("headerRight");
    // Đọc user từ cả 2 key để đảm bảo tương thích
    let user = JSON.parse(localStorage.getItem("shoeshop_user")) || 
              JSON.parse(localStorage.getItem("shoeshop_current_user_v1"));

    if (!headerRight) return;

    if (user) {
      let extra = "";

      if (user.role === "admin" || user.role === "ADMIN") {
        extra += `<a class="header-link" href="/admin-dashboard.html">Admin</a>`;
      }

      if (user.role === "staff" || user.role === "STAFF") {
        extra += `<a class="header-link" href="/pages/staff-dashboard.html">Staff</a>`;
      }

      if (user.role === "customer" || user.role === "CUSTOMER") {
        extra += `<a class="header-link" href="/pages/orders.html">Đơn hàng</a>`;
      }

      headerRight.innerHTML = `
      <div id="notificationBellArea"></div>
      ${extra}
      <span class="user-text">Xin chào, ${user.fullName || user.email}</span>
      <button class="header-btn" onclick="logout()">Đăng xuất</button>
    `;

      if (typeof renderNotificationBell === "function") {
        renderNotificationBell();
      }
    } else {
      headerRight.innerHTML = `
      <a class="header-link" href="/pages/auth.html">Đăng nhập</a>
      <a class="header-link" href="/pages/auth.html?tab=register">Đăng ký</a>
    `;
    }
  }

  function logout() {
    localStorage.removeItem("shoeshop_current_user_v1");
    localStorage.removeItem("shoeshop_user");
    localStorage.removeItem("shoeshop_token");
    localStorage.removeItem("user");
    localStorage.removeItem("token");
    window.location.href = "/index.html";
  }

  document.addEventListener('DOMContentLoaded', function() {
    // Add enter key support for search
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          performSearch();
        }
      });
    }

    // Update cart count on load
    updateCartCount();

    // Update cart count periodically (in case it changes from other pages)
    setInterval(updateCartCount, 1000);
    
    // Update header auth on load
    renderHeaderAuth();
  });
</script>
