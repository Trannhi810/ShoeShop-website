<div class="sidebar">

  <h2>Dashboard</h2>

  <ul id="menuList">
    <!-- render bằng JS -->
  </ul>

</div>

<script>
  const user = JSON.parse(localStorage.getItem("user"));
  const menu = document.getElementById("menuList");

  if (!user) {
    menu.innerHTML = "<li>Không có quyền</li>";
  } else {

    // ADMIN
    if (user.role === "admin") {
      menu.innerHTML = `
        <li><a href="/pages/admin/dashboard.html">Tổng quan</a></li>
        <li><a href="/pages/admin/products.html">Sản phẩm</a></li>
        <li><a href="/pages/admin/users.html">Người dùng</a></li>
        <li><a href="/pages/admin/orders.html">Đơn hàng</a></li>
        <li><a href="/pages/admin/categories.html">Danh mục</a></li>
        <li><a href="/pages/admin/inventory.html">Kho hàng</a></li>
      `;
    }

    // STAFF
    if (user.role === "staff") {
      menu.innerHTML = `
        <li><a href="/pages/staff/dashboard.html">Dashboard</a></li>
        <li><a href="/pages/staff/products.html">Sản phẩm</a></li>
        <li><a href="/pages/staff/orders.html">Đơn hàng</a></li>
      `;
    }

    // CUSTOMER
    if (user.role === "customer") {
      menu.innerHTML = `
        <li><a href="/index.html">Trang chủ</a></li>
        <li><a href="/pages/customer/orders.html">Đơn hàng</a></li>
      `;
    }
  }
</script>
