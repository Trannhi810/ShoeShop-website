<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán - ShoeShop</title>
  <meta name="description" content="Hoàn tất đơn hàng của bạn tại ShoeShop. Nhập thông tin giao hàng và xác nhận đặt hàng." />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/checkout.css" />
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="checkout-page">
      <h1>Thanh toán</h1>

      <!-- Loading -->
      <div id="stateLoading" class="checkout-loading" hidden>
        <div class="spinner"></div>
        <span>Đang tải giỏ hàng...</span>
      </div>

      <!-- Not logged in / Cart empty / Error -->
      <div id="stateEmpty" class="empty-cart-box" hidden>
        <div class="empty-icon" id="emptyIcon">🛒</div>
        <h3 id="emptyTitle">Giỏ hàng đang trống</h3>
        <p id="emptyDesc">Thêm sản phẩm vào giỏ hàng trước khi thanh toán nhé!</p>
        <a id="emptyAction" class="btn-checkout" href="/pages/products.html">Đi mua sắm ngay</a>
      </div>

      <!-- Main checkout layout -->
      <div id="stateCheckout" class="checkout-layout" hidden>

        <!-- LEFT: Form -->
        <div class="checkout-form-card">
          <h2>📋 Thông tin giao hàng</h2>
          <form id="checkoutForm" novalidate>
            <div class="form-group">
              <label for="fullName">Họ và tên</label>
              <input type="text" id="fullName" placeholder="Nhập họ và tên" required />
            </div>
            <div class="form-group">
              <label for="phone">Số điện thoại</label>
              <input type="tel" id="phone" placeholder="Nhập số điện thoại" required />
            </div>
            <div class="form-group">
              <label for="shippingAddress">Địa chỉ giao hàng</label>
              <textarea id="shippingAddress" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
            </div>
            <div class="form-group">
              <label for="note">Ghi chú (tùy chọn)</label>
              <textarea id="note" placeholder="Ghi chú thêm cho đơn hàng"></textarea>
            </div>
            <div class="form-group">
              <label>Phương thức thanh toán</label>
              <div class="payment-options">
                <label class="payment-option">
                  <input type="radio" name="paymentMethod" value="COD" checked />
                  <div class="payment-option-content">
                    <span class="payment-icon">💵</span>
                    <div>
                      <div class="payment-label">Thanh toán khi nhận hàng (COD)</div>
                      <div class="payment-desc">Bạn thanh toán tiền mặt khi nhận hàng</div>
                    </div>
                  </div>
                </label>
                <label class="payment-option">
                  <input type="radio" name="paymentMethod" value="VNPAY" />
                  <div class="payment-option-content">
                    <span class="payment-icon">💳</span>
                    <div>
                      <div class="payment-label">Thanh toán qua VNPAY</div>
                      <div class="payment-desc">Thẻ Cổng thanh toán tiện dụng</div>
                    </div>
                  </div>
                </label>
              </div>
            </div>
            <button type="submit" class="btn-checkout" id="submitBtn">
              🛍️ Xác nhận đặt hàng
            </button>
            <a class="btn-back" href="/pages/cart.html">← Quay lại giỏ hàng</a>
          </form>
        </div>

        <!-- RIGHT: Summary -->
        <div class="order-summary-card">
          <h2>🧾 Tóm tắt đơn hàng</h2>
          <div id="summaryItems" class="summary-items"></div>
          <hr class="summary-divider" />
          <div class="summary-total-row">
            <span>Tạm tính</span>
            <span id="summarySubtotal">0đ</span>
          </div>
          <div class="summary-total-row">
            <span>Vận chuyển</span>
            <span style="color:#15803d;font-weight:600;">Miễn phí</span>
          </div>
          <hr class="summary-divider" />
          <div class="summary-total-row grand-total">
            <span>Tổng cộng</span>
            <span id="summaryTotal" class="amount">0đ</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/notify.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
