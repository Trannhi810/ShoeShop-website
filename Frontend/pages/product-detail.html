<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm - ShoeShop</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <style>
    .page {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .detail-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
    }

    .detail-image {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fdfdfd;
    }

    .detail-image img {
      width: 100%;
      height: 420px;
      object-fit: contain;
      border-radius: 18px;
      padding: 16px;
    }

    .detail-info h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .detail-category {
      color: #666;
      margin-bottom: 10px;
    }

    .detail-price {
      color: #d62828;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .detail-desc {
      color: #555;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-dark,
    .btn-light {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-light {
      background: #ececec;
      color: #111;
    }

    .not-found {
      background: white;
      border: 1px dashed #ccc;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      color: #666;
    }

    .variant-group { margin-bottom: 20px; }
    .variant-group h3 { font-size: 16px; margin-bottom: 8px; font-weight: 600; }
    .variant-options { display: flex; gap: 10px; flex-wrap: wrap; }
    .variant-option {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }
    .variant-option.selected {
      border-color: #111;
      background: #111;
      color: white;
    }
    .stock-info {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .detail-box {
        grid-template-columns: 1fr;
      }

      .detail-image img {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="page">
    <div id="productDetail"></div>
  </main>

  <div id="footer"></div>

  <!-- Thêm các file JS gọi API -->
  <script src="/js/admin-utils.js"></script>
  <script src="/js/api-client.js"></script>
  <script>
    const PRODUCTS_KEY = "shoeshop_products_v1";
    const USER_KEY = "shoeshop_user";
    const CART_KEY = "shoeshop_cart_v1";

    async function loadComponent(id, file) {
      const res = await fetch(file + "?v=" + new Date().getTime());
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
      if (id === "header") renderHeaderAuth();
    }

    function renderHeaderAuth() {
  const headerRight = document.getElementById("headerRight");
  if (!headerRight) return;

  const currentUser = JSON.parse(localStorage.getItem(USER_KEY));

  if (currentUser) {
    let extraLink = "";

    if (currentUser.role === "admin") {
      extraLink = `<a class="header-link" href="/Frontend/pages/admin-dashboard.html">Admin</a>`;
    } else if (currentUser.role === "staff") {
      extraLink = `<a class="header-link" href="/Frontend/pages/staff-dashboard.html">Staff</a>`;
    }

    headerRight.innerHTML = `
      <div id="notificationBellArea"></div>
      ${extraLink}
      <span class="user-text">Xin chào, ${currentUser.fullName || currentUser.email}</span>
      <button class="header-btn" onclick="logout()">Đăng xuất</button>
    `;

    renderNotificationBell();
  } else {
    headerRight.innerHTML = `
      <a class="header-link" href="/Frontend/pages/auth.html">Đăng nhập</a>
      <a class="header-link" href="/Frontend/pages/auth.html?tab=register">Đăng ký</a>
    `;
  }
}

    function logout() {
      localStorage.removeItem(USER_KEY);
      window.location.href = "/Frontend/index.html";
    }

    async function loadProductAPI(id) {
      try {
        // Dùng fetch trực tiếp không cần token
        const res = await fetch(`http://localhost:3000/api/products/${id}`);
        const product = await res.json();
        return product;
      } catch (err) {
        console.error("Lỗi load product detail:", err);
        return null;
      }
    }

    let currentProduct = null;
    let selectedColor = null;
    let selectedSize = null;
    let selectedVariant = null;

    function renderVariants() {
      if (!currentProduct || !currentProduct.variants || currentProduct.variants.length === 0) return '';
      
      const colors = [...new Set(currentProduct.variants.map(v => v.color).filter(Boolean))];
      const sizes = [...new Set(currentProduct.variants.map(v => v.size).filter(Boolean))];
      
      let html = '';
      if (colors.length > 0) {
        html += `<div class="variant-group">
          <h3>Màu sắc</h3>
          <div class="variant-options">
            ${colors.map(c => `<button class="variant-option ${selectedColor === c ? 'selected' : ''}" onclick="selectColor('${c}')">${c}</button>`).join('')}
          </div>
        </div>`;
      }
      
      if (sizes.length > 0) {
        html += `<div class="variant-group">
          <h3>Kích cỡ</h3>
          <div class="variant-options">
            ${sizes.map(s => `<button class="variant-option ${selectedSize === s ? 'selected' : ''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
          </div>
        </div>`;
      }
      
      return html;
    }

    function selectColor(color) {
      selectedColor = color;
      checkVariant();
    }
    function selectSize(size) {
      selectedSize = size;
      checkVariant();
    }
    
    function checkVariant() {
      if (!currentProduct || !currentProduct.variants) return;
      
      const hasColors = currentProduct.variants.some(v => v.color);
      const hasSizes = currentProduct.variants.some(v => v.size);
      
      if ((hasColors && !selectedColor) || (hasSizes && !selectedSize)) {
          selectedVariant = null;
      } else {
          selectedVariant = currentProduct.variants.find(v => 
            (!hasColors || v.color === selectedColor) && 
            (!hasSizes || v.size === selectedSize)
          );
      }
      
      document.getElementById('variantsContainer').innerHTML = renderVariants();
      
      const priceEl = document.getElementById('displayPrice');
      const stockEl = document.getElementById('displayStock');
      
      if (selectedVariant) {
        priceEl.innerText = (selectedVariant.price || currentProduct.price || 0).toLocaleString("vi-VN") + "đ";
        stockEl.innerText = `Kho: ${selectedVariant.stock} sản phẩm`;
      } else {
         priceEl.innerText = (currentProduct.price || 0).toLocaleString("vi-VN") + "đ";
         stockEl.innerText = `Kho: ${currentProduct.stock || 0} sản phẩm (Vui lòng chọn đầy đủ phân loại)`;
      }
    }

    async function handleAddCart() {
       if (!currentProduct) return;
       if (currentProduct.variants && currentProduct.variants.length > 0) {
          if (!selectedVariant) {
             alert('Vui lòng chọn đầy đủ phân loại (màu sắc, kích cỡ)!');
             return;
          }
          const qty = document.getElementById('buyQuantity') ? parseInt(document.getElementById('buyQuantity').value) : 1;
          await executeAddToCart(selectedVariant._id, qty);
       } else {
          alert('Sản phẩm này chưa được thiết lập phân loại, không thể thêm vào giỏ. Vui lòng liên hệ Admin.');
       }
    }

    async function executeAddToCart(variantId, quantity) {
      const currentUser = JSON.parse(localStorage.getItem(USER_KEY));
      if (!currentUser) {
        alert("Vui lòng đăng nhập để thêm vào giỏ hàng");
        window.location.href = "/Frontend/pages/auth.html";
        return;
      }

      try {
        const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
        const res = await fetch("http://localhost:3000/api/cart/add", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ variantId: variantId, quantity: quantity })
        });
        
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.message || 'Lỗi khi thêm vào giỏ hàng');
        }
        
        alert("Đã thêm sản phẩm vào giỏ hàng");
      } catch (error) {
        alert("Lỗi: " + error.message);
      }
    }

    async function renderProductDetail() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id"); // Dùng ID dạng chuỗi
      
      const container = document.getElementById("productDetail");
      
      if (!id) {
        container.innerHTML = `<div class="not-found">ID sản phẩm không hợp lệ.</div>`;
        return;
      }

      const product = await loadProductAPI(id);

      if (!product) {
        container.innerHTML = `
          <div class="not-found">
            Không tìm thấy sản phẩm.<br><br>
            <a class="btn-dark" href="/Frontend/pages/products.html">Quay lại danh sách sản phẩm</a>
          </div>
        `;
        return;
      }

      currentProduct = product;
      selectedColor = null;
      selectedSize = null;
      selectedVariant = null;

      container.innerHTML = `
        <div class="detail-box">
          <div class="detail-image">
            <img src="${product.images && product.images.length > 0 ? product.images[0].url : '/images/placeholder.jpg'}" alt="${product.name}">
          </div>

          <div class="detail-info">
            <div class="detail-category">${product.category?.name || 'Chưa phân loại'}</div>
            <h1>${product.name}</h1>
            <div class="detail-price" id="displayPrice">${(product.price || 0).toLocaleString("vi-VN")}đ</div>
            <div class="stock-info" id="displayStock">Kho: ${product.stock || 0} sản phẩm</div>
            <div class="detail-desc">${product.description || ''}</div>

            <div id="variantsContainer">
              ${renderVariants()}
            </div>

            <div style="margin-bottom: 20px;">
              <h3 style="font-size: 16px; margin-bottom: 8px; font-weight: 600;">Số lượng</h3>
              <input type="number" id="buyQuantity" value="1" min="1" style="width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 8px;"/>
            </div>

            <div class="detail-actions">
              <button class="btn-dark" onclick="handleAddCart()">Thêm vào giỏ</button>
              <a class="btn-light" href="cart.html">Xem giỏ hàng</a>
              <a class="btn-light" href="products.html">Quay lại</a>
            </div>
          </div>
        </div>
      `;
    }

    loadComponent("header", "/components/header.html");
    loadComponent("footer", "/components/footer.html");
    renderProductDetail();
  </script>
</body>
</html>
