<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng - ShoeShop</title>
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/cart.css" />

</head>

<body>
  <div id="header"></div>

  <main class="page">
    <h1>Giỏ hàng của bạn</h1>
    <div class="cart-layout">
      <div id="cartList" class="cart-list"></div>
      <aside id="cartSummary" class="cart-summary"></aside>
    </div>
  </main>

  <div id="footer"></div>

  <!-- Thêm các file JS gọi API -->
  <script src="../../js/admin-utils.js"></script>
  <script src="../../js/api-client.js"></script>
  <script>
    const USER_KEY = "shoeshop_user";

    async function loadComponent(id, file) {
      try {
        // Them timestamp de chong cache components HTML
        const res = await fetch(file + "?v=" + new Date().getTime());
        const html = await res.text();
        document.getElementById(id).innerHTML = html;

        // Nếu là header, gọi renderHeaderAuth để cập nhật UI
        if (id === "header") {
          setTimeout(() => {
            if (typeof renderHeaderAuth === "function") {
              renderHeaderAuth();
            }
          }, 100);
        }
      } catch (error) {
        console.error("Lỗi tải component:", error);
      }
    }

    function renderHeaderAuth() {
      const headerRight = document.getElementById("headerRight");
      if (!headerRight) return;

      const currentUser = JSON.parse(localStorage.getItem(USER_KEY));

      if (currentUser) {
        let extraLink = "";

        if (currentUser.role === "ADMIN") {
          extraLink = `<a class="header-link" href="/pages/admin/dashboard.html">Admin</a>`;
        } else if (currentUser.role === "STAFF") {
          extraLink = `<a class="header-link" href="/pages/staff/dashboard.html">Staff</a>`;
        }

        headerRight.innerHTML = `
          <div id="notificationBellArea"></div>
          ${extraLink}
          <span class="user-text">Xin chào, ${currentUser.fullName || currentUser.email}</span>
          <button class="header-btn" onclick="logout()">Đăng xuất</button>
        `;

        // renderNotificationBell(); // Nếu có hàm này
      } else {
        headerRight.innerHTML = `
          <a class="header-link" href="/pages/customer/auth.html">Đăng nhập</a>
          <a class="header-link" href="/pages/customer/auth.html?tab=register">Đăng ký</a>
        `;
      }
    }

    function logout() {
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem("shoeshop_token");
      window.location.href = "/index.html";
    }

    async function increaseQty(itemId, currentQty) {
      try {
        // Dùng fetch trực tiếp với token
        const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
        const res = await fetch(`http://localhost:3000/api/cart/items/${itemId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ quantity: currentQty + 1 })
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.message || 'Lỗi cập nhật số lượng');
        }

        renderCart();
      } catch (error) {
        alert(error.message);
      }
    }

    async function decreaseQty(itemId, currentQty) {
      if (currentQty <= 1) {
        return removeItem(itemId);
      }
      try {
        // Dùng fetch trực tiếp với token
        const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
        const res = await fetch(`http://localhost:3000/api/cart/items/${itemId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ quantity: currentQty - 1 })
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.message || 'Lỗi cập nhật số lượng');
        }

        renderCart();
      } catch (error) {
        alert(error.message);
      }
    }

    async function removeItem(itemId) {
      if (!confirm("Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?")) return;
      try {
        // Dùng fetch trực tiếp với token
        const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
        const res = await fetch(`http://localhost:3000/api/cart/items/${itemId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.message || 'Lỗi xóa sản phẩm');
        }

        renderCart();
      } catch (error) {
        alert(error.message);
      }
    }

    async function renderCart() {
      const list = document.getElementById("cartList");
      const summary = document.getElementById("cartSummary");
      const currentUser = JSON.parse(localStorage.getItem(USER_KEY));

      if (!currentUser) {
        list.innerHTML = `
          <div class="empty-cart">
            Bạn cần đăng nhập để xem giỏ hàng.<br><br>
            <a class="btn-dark" style="display:inline-block; padding:12px 18px; border-radius:10px; text-decoration:none; color:white;" href="/pages/customer/auth.html">
              Đăng nhập ngay
            </a>
          </div>
        `;
        summary.innerHTML = "";
        return;
      }

      try {
        // Dùng fetch trực tiếp với token
        const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
        const res = await fetch("http://localhost:3000/api/cart", {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (!res.ok) {
          throw new Error('Không thể tải giỏ hàng');
        }

        const cartData = await res.json();
        // Backend trả về { success, data: { cartId, items } }
        const cartItems = (cartData.data && cartData.data.items) || [];

        if (!cartItems.length) {
          list.innerHTML = `
            <div class="empty-cart">
            Giỏ hàng của bạn đang trống.<br><br>
            <a class="btn-dark" style="display:inline-block; padding:12px 18px; border-radius:10px; text-decoration:none; color:white;" href="/pages/customer/products.html">
              Tiếp tục mua sắm
            </a>
          </div>
          `;

          summary.innerHTML = `
            <h3>Tóm tắt đơn hàng</h3>
            <p>Số dòng sản phẩm: 0</p>
            <p class="summary-total">Tổng tiền: 0đ</p>
            <div class="summary-actions">
              <a class="btn-light" href="/pages/customer/products.html">Xem sản phẩm</a>
              <button class="btn-dark" disabled>Thanh toán</button>
            </div>
          `;
          return;
        }

        list.innerHTML = cartItems.map(item => `
          <div class="cart-item">
            <img src="${item.image || '/images/placeholder.jpg'}" alt="${item.name}">
            <div class="cart-info">
              <h3>${item.name}</h3>
              <p>Phân loại: ${item.color || 'N/A'} - ${item.size || 'N/A'}</p>
              <p>Giá: ${(item.price || 0).toLocaleString("vi-VN")}đ</p>
            </div>
            <div class="cart-actions">
              <div class="qty-box">
                <button onclick="decreaseQty('${item.id}', ${item.quantity})">-</button>
                <span>${item.quantity}</span>
                <button onclick="increaseQty('${item.id}', ${item.quantity})">+</button>
              </div>
              <div class="item-total">${((item.price || 0) * item.quantity).toLocaleString("vi-VN")}đ</div>
              <button class="remove-btn" onclick="removeItem('${item.id}')">Xóa</button>
            </div>
          </div>
        `).join("");

        const totalLines = cartItems.length;
        const totalAmount = cartItems.reduce((sum, item) => sum + ((item.price || 0) * item.quantity), 0);

        summary.innerHTML = `
          <h3>Tóm tắt đơn hàng</h3>
          <p>Số dòng sản phẩm: ${totalLines}</p>
          <p class="summary-total">Tổng tiền: ${totalAmount.toLocaleString("vi-VN")}đ</p>
          <div class="summary-actions">
            <a class="btn-light" href="/pages/customer/products.html">Mua thêm</a>
            <button class="btn-dark" onclick="checkout()">Thanh toán</button>
          </div>
        `;

        // Đồng bộ lên header
        if (typeof window.syncCartCountFromAPI === "function") {
          window.syncCartCountFromAPI();
        } else {
          // Backup nếu header chưa kịp load
          const totalCartVal = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
          localStorage.setItem('shoeshop_cart_count', totalCartVal);
        }
      } catch (error) {
        list.innerHTML = `<div class="empty-cart">Lỗi tải giỏ hàng: ${error.message}</div>`;
      }
    }

    function checkout() {
      window.location.href = "/pages/customer/checkout.html";
    }

    loadComponent("header", "../../components/header.html");
    loadComponent("footer", "../../components/footer.html");
    renderCart();
  </script>
</body>

</html>
