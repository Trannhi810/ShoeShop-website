<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo - ShoeShop</title>
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/notifications.css" />
</head>
<body>
  <div id="header"></div>

  <main class="page">
    <h1>Thông báo</h1>

    <div class="top-actions">
      <button class="btn-dark" onclick="handleMarkAllAsRead()">Đánh dấu đã đọc tất cả</button>
      <a class="btn-light" href="/index.html">Về trang chủ</a>
    </div>

    <div id="notificationsList" class="notifications-list"></div>
  </main>

  <div id="footer"></div>

  <script src="../../js/api-client.js"></script>
  <script>
    const USER_KEY = "shoeshop_current_user_v1";

    async function loadComponent(id, file) {
      try {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;

        if (id === "header") {
          renderHeaderAuth();
          renderNotificationBell();
        }
      } catch (error) {
        console.log("Lỗi load component:", error);
      }
    }

    function renderHeaderAuth() {
  const headerRight = document.getElementById("headerRight");
  if (!headerRight) return;

  const currentUser = JSON.parse(localStorage.getItem(USER_KEY));

  if (currentUser) {
    let extraLink = "";

    if (currentUser.role === "admin") {
      extraLink = `<a class="header-link" href="/pages/admin/dashboard.html">Admin</a>`;
    } else if (currentUser.role === "staff") {
      extraLink = `<a class="header-link" href="/pages/staff/dashboard.html">Staff</a>`;
    }

    headerRight.innerHTML = `
      <div id="notificationBellArea"></div>
      ${extraLink}
      <span class="user-text">Xin chào, ${currentUser.fullName || currentUser.email}</span>
      <button class="header-btn" onclick="logout()">Đăng xuất</button>
    `;

    renderNotificationBell();
  } else {
    headerRight.innerHTML = `
      <a class="header-link" href="/pages/customer/auth.html">Đăng nhập</a>
      <a class="header-link" href="/pages/customer/auth.html?tab=register">Đăng ký</a>
    `;
  }
}
    function logout() {
      localStorage.removeItem(USER_KEY);
      window.location.href = "/index.html";
    }

    async function renderNotificationsPage() {
      const container = document.getElementById("notificationsList");
      const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
      
      if (!token) {
        container.innerHTML = `<div class="empty-box">Bạn cần đăng nhập để xem thông báo.</div>`;
        return;
      }

      try {
        const res = await fetch("http://localhost:3000/api/notifications", {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.message && !result.notifications) throw new Error(result.message);
        
        const notifications = result.notifications || [];
        if (!notifications.length) {
          container.innerHTML = `<div class="empty-box">Chưa có thông báo nào.</div>`;
          return;
        }

        container.innerHTML = notifications.map(item => `
          <div class="notify-card ${item.isRead ? "" : "unread"}">
            <div class="notify-head">
              <div class="notify-title">${item.title}</div>
              <div class="notify-time">${new Date(item.createdAt).toLocaleString('vi-VN')}</div>
            </div>
            <div class="notify-message">${item.message}</div>
            <div class="notify-actions">
              ${!item.isRead ? `<button class="btn-light" onclick="handleMarkOneAsRead('${item._id}')">Đánh dấu đã đọc</button>` : ""}
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<div class="empty-box">Lỗi tải thông báo: ${err.message}</div>`;
      }
    }

    async function handleMarkAllAsRead() {
      const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
      if (!token) return;
      try {
          await fetch("http://localhost:3000/api/notifications/read-all", {
              method: 'PATCH',
              headers: { 'Authorization': 'Bearer ' + token }
          });
          renderNotificationsPage();
          if(typeof window.renderNotificationBell === 'function') window.renderNotificationBell();
      } catch(e) {}
    }

    async function handleMarkOneAsRead(id) {
      const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
      if (!token) return;
      try {
          await fetch(`http://localhost:3000/api/notifications/${id}/read`, {
              method: 'PATCH',
              headers: { 'Authorization': 'Bearer ' + token }
          });
          renderNotificationsPage();
          if(typeof window.renderNotificationBell === 'function') window.renderNotificationBell();
      } catch(e) {}
    }

    loadComponent("header", "../../components/header.html");
    loadComponent("footer", "../../components/footer.html");
    setTimeout(renderNotificationsPage, 500); // Đợi js load xong
  </script>
</body>
</html>
