<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - ShoeShop</title>
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .page {
      margin: 32px auto;
      width: 1200px;
      max-width: calc(100% - 40px);
    }

    .breadcrumb {
      margin-bottom: 20px;
      font-size: 14px;
      color: #666;
    }

    .breadcrumb a {
      color: #666;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: #111;
    }

    .breadcrumb span {
      margin: 0 8px;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #111;
    }

    .page-header p {
      color: #666;
      font-size: 16px;
    }

    .search-section {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
    }

    .search-input-wrapper {
      display: flex;
      max-width: 500px;
      width: 100%;
      border: 2px solid #ddd;
      border-radius: 50px;
      overflow: hidden;
    }

    .search-input {
      flex: 1;
      padding: 12px 20px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-btn {
      padding: 12px 20px;
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-btn:hover {
      background: #333;
    }

    .main-content {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;
    }

    .sidebar {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      height: fit-content;
    }

    .filter-section {
      margin-bottom: 30px;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .filter-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 0;
    }

    .filter-option input[type="checkbox"] {
      margin-right: 10px;
    }

    .filter-option label {
      flex: 1;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-count {
      color: #666;
      font-size: 12px;
    }

    .product-area {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .product-count {
      font-size: 16px;
      font-weight: 600;
      color: #111;
    }

    .sort-dropdown {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .product-card {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .product-image-wrapper {
      position: relative;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.05);
    }

    .new-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff6b6b;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .product-body {
      padding: 15px;
    }

    .product-brand {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
      line-height: 1.4;
      height: 40px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .product-colors {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #ddd;
    }

    .product-price {
      font-size: 16px;
      font-weight: 700;
      color: #d62828;
      margin-bottom: 12px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .btn-add-cart {
      flex: 1;
      background: #111;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add-cart:hover {
      background: #333;
    }

    .btn-view-detail {
      flex: 1;
      background: #f8f9fa;
      color: #111;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      text-align: center;
    }

    .btn-view-detail:hover {
      background: #e9ecef;
      border-color: #111;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .pagination-btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .pagination-btn:hover:not(.active):not(:disabled) {
      border-color: #111;
      color: #111;
    }

    .pagination-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 250px 1fr;
        gap: 20px;
      }
    }

    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: 2;
      }

      .product-area {
        order: 1;
      }

      .search-section {
        flex-direction: column;
        align-items: stretch;
      }

      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header"></div>

<main class="page">

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <a href="../index.html">Trang chủ</a>
    <span>></span>
    <a href="#">Sản phẩm</a>
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Sản phẩm</h1>
    <p>Tìm kiếm sản phẩm trong trang này</p>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <div class="search-input-wrapper">
      <input type="text" class="search-input" placeholder="Tìm kiếm sản phẩm trong trang này" id="pageSearchInput">
      <button class="search-btn" onclick="performPageSearch()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Sidebar Filters -->
    <aside class="sidebar">
      
      <!-- Brand Filter -->
      <div class="filter-section">
        <h3 class="filter-title">THƯƠNG HIỆU</h3>
        <input type="text" class="filter-search" placeholder="Tùy chọn tìm kiếm" id="brandSearch">
        <div id="brandFilters"></div>
      </div>

      <!-- Size Filter -->
      <div class="filter-section">
        <h3 class="filter-title">KÍCH THƯỚC</h3>
        <div class="filter-option">
          <input type="checkbox" id="size-39" value="39">
          <label for="size-39">39</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="size-40" value="40">
          <label for="size-40">40</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="size-41" value="41">
          <label for="size-41">41</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="size-42" value="42">
          <label for="size-42">42</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="size-43" value="43">
          <label for="size-43">43</label>
        </div>
        <div class="filter-option">
          <input type="checkbox" id="size-44" value="44">
          <label for="size-44">44</label>
        </div>
      </div>

      <!-- Color Filter -->
      <div class="filter-section">
        <h3 class="filter-title">MÀU SẮC</h3>
        <div id="colorFilters"></div>
      </div>

    </aside>

    <!-- Product Area -->
    <section class="product-area">
      
      <div class="product-header">
        <div class="product-count" id="productCount">0 sản phẩm</div>
        <select class="sort-dropdown" id="sortDropdown">
          <option value="default">Sắp xếp</option>
          <option value="price-asc">Giá: Thấp đến cao</option>
          <option value="price-desc">Giá: Cao đến thấp</option>
          <option value="name-asc">Tên: A-Z</option>
          <option value="name-desc">Tên: Z-A</option>
          <option value="newest">Mới nhất</option>
        </select>
      </div>

      <div id="productList" class="product-grid"></div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>

    </section>

  </div>

</main>

<!-- FOOTER -->
<div id="footer"></div>

<script src="../js/api-client.js"></script>

<script>
// Pagination variables
let currentPage = 1;
const productsPerPage = 12;
let totalProducts = 0;
let allProducts = [];
let allBrands = [];
let allColors = [];

function renderHeaderAuth() {
  const headerRight = document.getElementById("headerRight");
  if (!headerRight) return;

  const user = JSON.parse(localStorage.getItem("shoeshop_user")) || 
               JSON.parse(localStorage.getItem("shoeshop_current_user_v1"));

  if (user) {
    let extra = "";

    if (user.role === "ADMIN" || user.role === "admin") {
      extra += `<a class="header-link" href="/admin-dashboard.html">Admin</a>`;
    }

    if (user.role === "STAFF" || user.role === "staff") {
      extra += `<a class="header-link" href="/pages/staff-dashboard.html">Staff</a>`;
    }

    if (user.role === "customer" || user.role === "CUSTOMER") {
      extra += `<a class="header-link" href="/pages/orders.html">Đơn hàng</a>`;
    }

    headerRight.innerHTML = `
    <div id="notificationBellArea"></div>
    ${extra}
    <span class="user-text">Xin chào, ${user.fullName || user.email}</span>
    <button class="header-btn" onclick="logout()">Đăng xuất</button>
  `;

    if (typeof renderNotificationBell === "function") {
      renderNotificationBell();
    }
  } else {
    headerRight.innerHTML = `
    <a class="header-link" href="/pages/auth.html">Đăng nhập</a>
    <a class="header-link" href="/pages/auth.html?tab=register">Đăng ký</a>
  `;
  }
}

async function loadComponent(id, file) {
  const res = await fetch(file);
  const html = await res.text();
  document.getElementById(id).innerHTML = html;
  
  // Nếu là header, gọi renderHeaderAuth để cập nhật UI
  if (id === "header") {
    setTimeout(() => {
      const user = JSON.parse(localStorage.getItem("shoeshop_user")) || 
                   JSON.parse(localStorage.getItem("shoeshop_current_user_v1"));
      console.log("User in localStorage:", user);
      
      if (typeof renderHeaderAuth === "function") {
        renderHeaderAuth();
      }
    }, 200);
  }
}

async function renderProducts(page = 1) {
  try {
    // Lấy tất cả sản phẩm từ API - dùng fetch trực tiếp không cần token
    const res = await fetch("http://localhost:3000/api/products");
    const data = await res.json();
    
    allProducts = data;
    totalProducts = allProducts.length;
    
    console.log("Total products:", totalProducts);
    console.log("Products per page:", productsPerPage);
    console.log("Total pages:", Math.ceil(totalProducts / productsPerPage));
    
    // Trích xuất thương hiệu và màu sắc từ database
    allBrands = [...new Set(allProducts.map(p => p.brand).filter(Boolean))];
    allColors = [...new Set(allProducts.flatMap(p => p.colors || []))];
    
    // Render filters
    renderFilters();
    
    // Tính toán sản phẩm cho trang hiện tại
    const startIndex = (page - 1) * productsPerPage;
    const endIndex = startIndex + productsPerPage;
    const currentPageProducts = allProducts.slice(startIndex, endIndex);
    
    const list = document.getElementById("productList");
    const productCount = document.getElementById("productCount");
    
    // Cập nhật số lượng sản phẩm
    if (productCount) {
      productCount.textContent = `Hiển thị ${currentPageProducts.length} trong ${totalProducts} sản phẩm`;
    }
    
    // Render sản phẩm
    list.innerHTML = currentPageProducts.map(p => `
      <div class="product-card">
        <div class="product-image-wrapper">
          <img class="product-image" src="${p.images && p.images.length > 0 ? p.images[0].url : 'https://images.unsplash.com/photo-1542291026-7eec264c27ff'}" alt="${p.name}">
          ${p.isNew ? '<span class="new-badge">MỚI</span>' : ''}
        </div>
        <div class="product-info">
          <h3>${p.name}</h3>
          <p class="product-price">${(p.price || 0).toLocaleString("vi-VN")}đ</p>
          <div class="card-actions">
            <button class="btn-dark" onclick="addToCart('${p._id}')">Thêm vào giỏ</button>
            <a class="btn-light" href="product-detail.html?id=${p._id}">Chi tiết</a>
          </div>
        </div>
      </div>
    `).join("");
    
    // Render pagination
    renderPagination(page);
    
  } catch (error) {
    console.error("Lỗi load sản phẩm:", error);
    const list = document.getElementById("productList");
    list.innerHTML = `<div class="not-found">Không thể tải sản phẩm. Vui lòng thử lại sau.</div>`;
  }
}

function renderFilters() {
  // Render brand filters
  const brandContainer = document.getElementById('brandFilters');
  const brandFiltersHTML = allBrands.map(brand => {
    const count = allProducts.filter(p => p.brand === brand).length;
    return `
      <div class="filter-option">
        <input type="checkbox" id="brand-${brand.toLowerCase()}" value="${brand}" onchange="applyFilters()">
        <label for="brand-${brand.toLowerCase()}">${brand.toUpperCase()}</label>
        <span class="filter-count">(${count})</span>
      </div>
    `;
  }).join('');
  
  brandContainer.innerHTML = brandFiltersHTML;
  
  // Render color filters
  const colorContainer = document.getElementById('colorFilters');
  const colorFiltersHTML = allColors.map(color => {
    const count = allProducts.filter(p => p.colors?.includes(color)).length;
    const colorName = {
      'black': 'Đen',
      'white': 'Trắng', 
      'blue': 'Xanh',
      'red': 'Đỏ',
      'gray': 'Xám',
      'green': 'Xanh lá',
      'yellow': 'Vàng',
      'purple': 'Tím',
      'orange': 'Cam',
      'brown': 'Nâu'
    }[color] || color;
    
    return `
      <div class="filter-option">
        <input type="checkbox" id="color-${color}" value="${color}" onchange="applyFilters()">
        <label for="color-${color}">${colorName}</label>
      </div>
    `;
  }).join('');
  
  colorContainer.innerHTML = colorFiltersHTML;
}

function applyFilters() {
  const selectedBrands = Array.from(document.querySelectorAll('#brandFilters input:checked'))
    .map(input => input.value);
  const selectedColors = Array.from(document.querySelectorAll('#colorFilters input:checked'))
    .map(input => input.value);
  
  let filteredProducts = allProducts;
  
  // Apply brand filter
  if (selectedBrands.length > 0) {
    filteredProducts = filteredProducts.filter(p => selectedBrands.includes(p.brand));
  }
  
  // Apply color filter
  if (selectedColors.length > 0) {
    filteredProducts = filteredProducts.filter(p => 
      p.colors && p.colors.some(color => selectedColors.includes(color))
    );
  }
  
  // Update display
  const tempProducts = allProducts;
  allProducts = filteredProducts;
  totalProducts = filteredProducts.length;
  renderProducts(1);
  
  // Reset to original products if no filters
  if (selectedBrands.length === 0 && selectedColors.length === 0) {
    allProducts = tempProducts;
    totalProducts = tempProducts.length;
    renderProducts(1);
  }
}

function renderPagination(currentPage) {
  const paginationContainer = document.getElementById("pagination");
  const totalPages = Math.ceil(totalProducts / productsPerPage);
  
  if (totalPages <= 1) {
    paginationContainer.innerHTML = "";
    return;
  }
  
  let paginationHTML = "";
  
  // Previous button
  paginationHTML += `
    <button class="pagination-btn" onclick="renderProducts(${currentPage - 1})" 
            ${currentPage === 1 ? 'disabled' : ''}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Trước
    </button>
  `;
  
  // Page numbers
  const maxVisiblePages = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
  let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
  
  if (endPage - startPage < maxVisiblePages - 1) {
    startPage = Math.max(1, endPage - maxVisiblePages + 1);
  }
  
  for (let i = startPage; i <= endPage; i++) {
    paginationHTML += `
      <button class="pagination-btn ${i === currentPage ? 'active' : ''}" 
              onclick="renderProducts(${i})">${i}</button>
    `;
  }
  
  // Next button
  paginationHTML += `
    <button class="pagination-btn" onclick="renderProducts(${currentPage + 1})" 
            ${currentPage === totalPages ? 'disabled' : ''}>
      Tiếp
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  `;
  
  paginationContainer.innerHTML = paginationHTML;
}

async function addToCart(productId) {
  const currentUser = JSON.parse(localStorage.getItem("shoeshop_user")) || 
                       JSON.parse(localStorage.getItem("shoeshop_current_user_v1"));
  
  if (!currentUser) {
    alert("Vui lòng đăng nhập để thêm vào giỏ hàng");
    window.location.href = "/pages/auth.html";
    return;
  }

  try {
    // Dùng fetch trực tiếp với token
    const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
    const res = await fetch("http://localhost:3000/api/cart/add", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ variantId: productId, quantity: 1 })
    });
    
    if (!res.ok) {
      const error = await res.json();
      throw new Error(error.message || 'Lỗi khi thêm vào giỏ hàng');
    }
    
    alert("Đã thêm sản phẩm vào giỏ hàng");
    updateCartCount();
  } catch (error) {
    alert("Lỗi: " + error.message);
  }
}

function performPageSearch() {
  const searchInput = document.getElementById('pageSearchInput');
  const searchTerm = searchInput.value.trim();
  if (searchTerm) {
    // Filter products based on search term
    const filteredProducts = allProducts.filter(p => 
      p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      p.brand?.toLowerCase().includes(searchTerm.toLowerCase())
    );
    
    const tempProducts = allProducts;
    allProducts = filteredProducts;
    totalProducts = filteredProducts.length;
    renderProducts(1);
    
    // Reset on clear
    searchInput.addEventListener('input', function() {
      if (this.value.trim() === '') {
        allProducts = tempProducts;
        totalProducts = tempProducts.length;
        renderProducts(1);
      }
    });
  }
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('shoeshop_cart_v1') || '[]');
  const cartCount = document.getElementById('cartCount');
  if (cartCount) {
    const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    cartCount.textContent = totalItems;
    cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
  }
}

function logout() {
  localStorage.removeItem("shoeshop_user");
  localStorage.removeItem("shoeshop_current_user_v1");
  localStorage.removeItem("shoeshop_token");
  localStorage.removeItem("user");
  localStorage.removeItem("token");
  window.location.href = "/index.html";
}

/* INIT */
loadComponent("header", "../components/header.html");
loadComponent("footer", "../components/footer.html");
renderProducts();
</script>

</body>
</html>
