<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kết quả thanh toán - ShoeShop</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <style>
    .payment-result-page {
      max-width: 600px;
      margin: 60px auto;
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    .success-icon { color: #10b981; }
    .error-icon { color: #ef4444; }
    
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #111;
    }
    
    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .amount-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #111;
      border: 1px dashed #cbd5e1;
    }
    
    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    
    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #111;
      color: white;
      border: none;
    }
    
    .btn-primary:hover { background: #333; }
    
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: none;
    }
    
    .btn-secondary:hover { background: #e2e8f0; }

    /* Hiệu ứng load */
    .initial-loading {
      margin: 100px auto;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main>
    <div id="loadingView" class="initial-loading">
      <div class="spinner"></div>
      <p style="margin-top: 16px;">Đang xác thực giao dịch VNPAY...</p>
    </div>

    <div id="resultView" class="payment-result-page" hidden>
      <div id="resultIcon" class="icon">❓</div>
      <h1 id="resultTitle">Đang xử lý...</h1>
      <p id="resultMessage">Vui lòng chờ một chút để chúng tôi kiểm tra giao dịch.</p>
      
      <div id="amountContainer" class="amount-box" hidden>
        Số tiền thanh toán: <span id="paymentAmount">0</span>đ
      </div>

      <div class="actions">
        <a href="/pages/orders.html" class="btn btn-primary">Xem đơn hàng</a>
        <a href="/index.html" class="btn btn-secondary">Về trang chủ</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/admin-utils.js"></script>
  <script src="/js/api-client.js"></script>
  <script>
    async function loadComponent(id, file) {
      try {
        const res = await fetch(file + "?v=" + new Date().getTime());
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
        if (id === "header" && typeof renderHeaderAuth === "function") {
          setTimeout(renderHeaderAuth, 100);
        }
      } catch (error) {
        console.error("Lỗi tải component:", error);
      }
    }

    // Xử lý tham số truy vấn
    function processResult() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const amount = urlParams.get('amount');

      const loadingView = document.getElementById('loadingView');
      const resultView = document.getElementById('resultView');
      const resultIcon = document.getElementById('resultIcon');
      const resultTitle = document.getElementById('resultTitle');
      const resultMessage = document.getElementById('resultMessage');
      const amountContainer = document.getElementById('amountContainer');
      const paymentAmount = document.getElementById('paymentAmount');

      loadingView.hidden = true;
      resultView.hidden = false;

      // Mã 00 là thành công
      if (code === '00') {
        resultIcon.textContent = '✅';
        resultIcon.className = 'icon success-icon';
        resultTitle.textContent = 'Thanh toán thành công!';
        resultMessage.textContent = 'Cảm ơn bạn đã mua sắm tại ShoeShop. Đơn hàng của bạn đã được ghi nhận và đang chờ xử lý phát hàng.';
        
        if (amount) {
          amountContainer.hidden = false;
          // VNPAY trả về amount = giá trị * 100
          const realAmount = Number(amount) / 100;
          paymentAmount.textContent = realAmount.toLocaleString('vi-VN');
        }
      } else {
        resultIcon.textContent = '❌';
        resultIcon.className = 'icon error-icon';
        resultTitle.textContent = 'Thanh toán lỗi hoặc bị hủy!';
        resultMessage.textContent = `Giao dịch không thành công (Mã lỗi: ${code}). Bạn có thể thử thanh toán lại trong phần Quản lý đơn hàng hoặc thay đổi phương thức thanh toán.`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadComponent("header", "/components/header.html");
      loadComponent("footer", "/components/footer.html");
      
      // Delay chút để nhìn thấy loading
      setTimeout(processResult, 800);
    });
  </script>
</body>
</html>
