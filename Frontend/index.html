<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShoeShop - Trang chủ</title>

  <!-- FIX CSS PATH -->
  <link rel="stylesheet" href="css/layout.css">

  <style>
    .hero {
      background: linear-gradient(135deg, #111, #333);
      padding: 60px 20px;
      color: white;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .hero h1 {
      font-size: 48px;
    }

    .hero p {
      color: #ccc;
      margin: 15px 0;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
    }

    .btn-main {
      background: white;
      color: black;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .btn-outline {
      border: 1px solid white;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .hero img {
      width: 350px;
      transition: 0.3s;
    }

    .hero img:hover {
      transform: scale(1.05);
    }

    .section {
      margin: 40px auto;
      width: 1200px;
      max-width: calc(100% - 40px);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      border-color: transparent;
    }

    .product-image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #ffffff;
    }

    .product-image-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 16px;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-image-wrapper img {
      transform: scale(1.05);
    }

    .new-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff4b2b;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      z-index: 2;
    }

    .product-card-body {
      padding: 0 16px 16px 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-card-body h3 {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin: 0 0 6px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-category {
      font-size: 12px;
      color: #888;
      margin: 0 0 16px 0;
      flex-grow: 1;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: #1a73e8;
      margin: 0;
    }

    @media (max-width:900px){
      .hero-inner{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">

    <div>
      <h1>Bước đi phong cách cùng ShoeShop</h1>
      <p>Khám phá bộ sưu tập giày sneaker, running và casual hiện đại.</p>

      <div class="hero-actions">
        <a class="btn-main" href="pages/products.html">Mua ngay</a>
        <a class="btn-outline" href="pages/products.html">Xem sản phẩm</a>
      </div>
    </div>

    <div style="display:flex;justify-content:center;">
      <!-- FIX ẢNH -->
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80">
    </div>

  </div>
</section>

<!-- PRODUCTS -->
<section class="section">
  <div class="section-head">
    <h2>Sản phẩm nổi bật</h2>
    <a href="pages/products.html">Xem tất cả</a>
  </div>

  <div id="featuredProducts" class="product-grid"></div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script src="js/api-client.js"></script>

<script>
const USER_KEY = "shoeshop_current_user_v1";

/* LOAD COMPONENT */
async function loadComponent(id, file) {
  try {
    const res = await fetch(file + "?v=" + new Date().getTime());
    const html = await res.text();
    document.getElementById(id).innerHTML = html;

    if (id === "header") renderHeaderAuth();

  } catch (e) {
    console.log("Lỗi load component:", e);
  }
}

/* HEADER AUTH */
function renderHeaderAuth() {
  const headerRight = document.getElementById("headerRight");
  const user = JSON.parse(localStorage.getItem(USER_KEY));

  if (!headerRight) return;

  if (user) {
    let extra = "";

    if (user.role === "ADMIN") {
      extra += `<a class="header-link" href="/admin-dashboard.html">Admin</a>`;
    } else if (user.role === "STAFF") {
      extra += `<a class="header-link" href="/pages/staff-dashboard.html">Staff</a>`;
    }

    headerRight.innerHTML = `
      <div id="notificationBellArea"></div>
      ${extra}
      <span class="user-text">Xin chào, ${user.fullName || user.email}</span>
      <button class="header-btn" onclick="logout()">Đăng xuất</button>
    `;
  } else {
    headerRight.innerHTML = `
      <a class="header-link" href="pages/auth.html">Đăng nhập</a>
      <a class="header-link" href="pages/auth.html?tab=register">Đăng ký</a>
    `;
  }
}

function logout() {
  localStorage.removeItem(USER_KEY);
  location.reload();
}

/* LOAD PRODUCTS */
async function renderFeaturedProducts() {
  try {
    // Dùng fetch trực tiếp không cần token
    const res = await fetch("http://localhost:3000/api/products");
    const products = await res.json();
    
    // Lấy 4 sản phẩm đầu tiên hoặc ngẫu nhiên
    const featuredProducts = products.slice(0, 4);
    
    const container = document.getElementById("featuredProducts");

    container.innerHTML = featuredProducts.map(p => {
      const imgUrl = p.images && p.images.length > 0 ? p.images[0].url : 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80';
      return `
      <div class="product-card" onclick="window.location.href='pages/product-detail.html?id=${p._id}'">
        <div class="product-image-wrapper">
          <img src="${imgUrl}" alt="${p.name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80';">
          ${p.isNew ? '<span class="new-badge">MỚI</span>' : ''}
        </div>
        <div class="product-card-body">
          <h3>${p.name}</h3>
          <p class="product-category">${p.category?.name || p.brand || 'Khám phá sản phẩm'}</p>
          <p class="product-price">${(p.price || 0).toLocaleString('vi-VN')} đ</p>
        </div>
      </div>
      `
    }).join("");

  } catch (error) {
    console.error("Lỗi load sản phẩm:", error);
    const container = document.getElementById("featuredProducts");
    container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">Không thể tải sản phẩm. Vui lòng thử lại sau.</p>';
  }
}

async function addToCart(productId) {
  const currentUser = JSON.parse(localStorage.getItem("shoeshop_user")) || 
                       JSON.parse(localStorage.getItem("shoeshop_current_user_v1"));
  
  if (!currentUser) {
    alert("Vui lòng đăng nhập để thêm vào giỏ hàng");
    window.location.href = "pages/auth.html";
    return;
  }

  try {
    // Dùng fetch trực tiếp với token
    const token = localStorage.getItem("shoeshop_token") || localStorage.getItem("token");
    const res = await fetch("http://localhost:3000/api/cart/add", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ variantId: productId, quantity: 1 })
    });
    
    if (!res.ok) {
      const error = await res.json();
      throw new Error(error.message || 'Lỗi khi thêm vào giỏ hàng');
    }
    
    alert("Đã thêm sản phẩm vào giỏ hàng");
    updateCartCount();
  } catch (error) {
    alert("Lỗi: " + error.message);
  }
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('shoeshop_cart_v1') || '[]');
  const cartCount = document.getElementById('cartCount');
  if (cartCount) {
    const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    cartCount.textContent = totalItems;
    cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
  }
}

/* INIT */
loadComponent("header", "components/header.html");
loadComponent("footer", "components/footer.html");
renderFeaturedProducts();
</script>

</body>
</html>
